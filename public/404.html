    :root{--ink:#191919;--muted:#777674;--peach:#e6a68c;--paper:#f7f6f3}
    *{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:HelveticaLocal,Arial,sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 45% 38% at 50% 43%,rgba(211,209,205,.8),transparent 88%),radial-gradient(ellipse 35% 25% at 87% 9%,rgba(230,166,140,.17),transparent 85%),radial-gradient(ellipse 40% 30% at 5% 95%,rgba(200,198,194,.24),transparent 90%)}
    .page{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:60px 24px 72px;isolation:isolate}
    .content{width:min(100%,920px);text-align:center}
    .status{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(25,25,25,.12);background:rgba(255,255,255,.54);border-radius:100px;padding:11px 17px;color:#686662;font-size:11px;font-weight:bold;letter-spacing:.2em;text-transform:uppercase;backdrop-filter:blur(8px)}
    .status:before{content:"";height:8px;width:8px;background:var(--peach);border-radius:50%;box-shadow:0 0 0 4px rgba(230,166,140,.16)}
    .art{position:relative;margin:27px auto 0;max-width:840px}
    .code{font-family:Moderniz,Arial Black,sans-serif;font-weight:900;font-size:clamp(112px,25vw,290px);letter-spacing:-.105em;line-height:1.03;white-space:nowrap;padding-right:.1em;color:#1b1b1b}
    .zero{display:inline-block;position:relative;color:var(--peach);transform:rotate(-12deg) translateY(-.015em);text-shadow:11px 12px 0 rgba(25,25,25,.07)}
    .art:after{content:"";display:block;height:1px;width:min(65%,500px);margin:-4px auto 0;background:linear-gradient(90deg,transparent,rgba(30,30,30,.2),transparent)}
    h1{font-family:Moderniz,Arial Black,sans-serif;font-size:clamp(25px,4.5vw,45px);line-height:1.18;letter-spacing:-.045em;margin:32px auto 15px;max-width:850px}
    .description{font-size:clamp(15px,2.2vw,18px);line-height:1.7;color:#666460;max-width:530px;margin:0 auto}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:32px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:16px 23px;text-decoration:none;border-radius:12px;font-size:13px;font-weight:bold;letter-spacing:.06em;transition:transform .2s,background .2s,box-shadow .2s}
    .button:hover{transform:translateY(-3px)}.primary{background:#191919;color:#fff;box-shadow:0 16px 30px rgba(0,0,0,.16)}.primary:hover{background:#333}.secondary{color:#292929;border:1px solid rgba(25,25,25,.2);background:rgba(255,255,255,.35)}
    .button svg{width:19px;height:19px;flex:none}
    .note{margin-top:22px;color:#96938e;font-size:12px;letter-spacing:.015em}
    @media(max-width:600px){.page{padding:55px 20px 65px}.status{font-size:9px}.art{margin-top:40px}.code{font-size:clamp(104px,28vw,160px)}h1{margin-top:32px;font-size:clamp(24px,7vw,34px)}.description{font-size:15px}.actions{flex-direction:column;align-items:stretch;max-width:340px;margin:28px auto 0}.button{width:100%}.note{line-height:1.5}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
